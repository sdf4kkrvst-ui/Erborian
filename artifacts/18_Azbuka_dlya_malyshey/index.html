<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}</style></head><body>
<title>Азбука для малышей</title>
<style>
  :root {
    --bg-1: #FFF8E7;
    --bg-2: #FFEFC6;
    --card: #FFFDF8;
    --card-edge: #F3E3BE;
    --ink: #4A3324;
    --ink-soft: #9A7F5C;
    --letter: #FF6B45;
    --letter-shadow: #E85A38;
    --rind: #2F9E5B;
    --rind-dark: #227A44;
    --focus: #2F9E5B;
    --chip: #FFFFFF;
    --chip-edge: #F0DFB8;
    --shadow: 0 30px 60px -20px rgba(74, 51, 36, 0.35);
  }

  :root[data-theme="dark"] {
    --bg-1: #1B1330;
    --bg-2: #2A1C46;
    --card: #241B3D;
    --card-edge: #3A2C5C;
    --ink: #F5EAD9;
    --ink-soft: #C7B6DC;
    --letter: #FF8F6B;
    --letter-shadow: #D96A48;
    --rind: #4DBE82;
    --rind-dark: #7FD9A8;
    --focus: #7FD9A8;
    --chip: #2E2350;
    --chip-edge: #45356C;
    --shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.6);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg-1: #1B1330; --bg-2: #2A1C46; --card: #241B3D; --card-edge: #3A2C5C;
      --ink: #F5EAD9; --ink-soft: #C7B6DC; --letter: #FF8F6B; --letter-shadow: #D96A48;
      --rind: #4DBE82; --rind-dark: #7FD9A8; --focus: #7FD9A8;
      --chip: #2E2350; --chip-edge: #45356C; --shadow: 0 30px 60px -20px rgba(0,0,0,0.6);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: clamp(16px, 3vw, 40px);
    background: radial-gradient(120% 90% at 50% -10%, var(--bg-2) 0%, var(--bg-1) 60%);
    font-family: 'Segoe UI Rounded', 'SF Rounded', ui-rounded, 'Nunito', 'Segoe UI', system-ui, sans-serif;
    color: var(--ink);
  }

  .app { width: 100%; max-width: 920px; display: flex; flex-direction: column; gap: 16px; }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  .brand {
    font-weight: 800;
    font-size: clamp(16px, 2.2vw, 20px);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .progress-wrap { display: flex; align-items: center; gap: 10px; flex: 1; justify-content: flex-end; min-width: 220px; }

  .progress-track {
    position: relative;
    width: clamp(140px, 28vw, 260px);
    height: 8px;
    background: var(--chip-edge);
    border-radius: 999px;
    overflow: hidden;
  }

  .progress-fill {
    position: absolute;
    inset: 0;
    width: 0%;
    background: var(--rind);
    border-radius: 999px;
    transition: width 0.35s ease;
  }

  .counter { font-size: 14px; font-weight: 700; color: var(--ink-soft); font-variant-numeric: tabular-nums; white-space: nowrap; }

  .card {
    position: relative;
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-radius: clamp(28px, 4vw, 44px);
    box-shadow: var(--shadow);
    padding: clamp(26px, 5vw, 52px) clamp(22px, 6vw, 60px);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: clamp(8px, 2vw, 16px);
    min-height: clamp(360px, 46vw, 480px);
  }

  .eyebrow {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-size: clamp(12px, 1.4vw, 14px);
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .scene {
    position: relative;
    display: grid;
    grid-template-columns: 1.05fr 0.95fr;
    align-items: center;
    min-height: clamp(200px, 30vw, 300px);
  }

  .letters { position: relative; display: flex; align-items: baseline; line-height: 1; z-index: 2; }

  .letter-big {
    font-size: clamp(120px, 20vw, 260px);
    font-weight: 800;
    color: var(--letter);
    text-shadow: 6px 8px 0 var(--letter-shadow);
  }

  .letter-small {
    font-size: clamp(60px, 10vw, 130px);
    font-weight: 700;
    color: var(--letter);
    opacity: 0.72;
    margin-left: 0.05em;
  }

  .icon-wrap { position: relative; display: flex; justify-content: center; }
  .icon-wrap svg { width: clamp(140px, 22vw, 260px); height: auto; }

  .caption { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }

  .word { font-size: clamp(26px, 3.6vw, 40px); font-weight: 800; letter-spacing: 0.05em; color: var(--rind-dark); }
  .hint { font-size: clamp(14px, 1.7vw, 17px); font-weight: 600; color: var(--ink-soft); }

  /* entrance animation, retriggered per slide via .enter class */
  .anim-eyebrow, .anim-letters, .anim-icon, .anim-caption { opacity: 0; }
  .enter .anim-eyebrow { animation: rise 0.5s ease-out 0.02s forwards; }
  .enter .letter-big { animation: drop 0.6s cubic-bezier(.34,1.56,.64,1) 0.18s forwards; }
  .enter .letter-small { animation: drop 0.6s cubic-bezier(.34,1.56,.64,1) 0.28s forwards; }
  .enter .anim-icon { animation: pop 0.55s cubic-bezier(.22,1,.36,1) 0.42s forwards; }
  .enter .anim-caption { animation: rise 0.5s ease-out 0.68s forwards; }
  .letter-big, .letter-small { opacity: 0; transform: translateY(-140%); }

  @keyframes drop { 0% { transform: translateY(-140%); opacity: 0; } 60% { opacity: 1; } 100% { transform: translateY(0); opacity: 1; } }
  @keyframes rise { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes pop { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    .anim-eyebrow, .anim-icon, .anim-caption, .letter-big, .letter-small { animation: none !important; opacity: 1 !important; transform: none !important; }
  }

  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .ctrl-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: 1.5px solid var(--card-edge);
    background: var(--chip);
    color: var(--ink);
    font: inherit;
    font-weight: 700;
    font-size: clamp(13px, 1.6vw, 15px);
    padding: 12px 18px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.15s ease, border-color 0.15s ease;
  }

  .ctrl-btn:hover { border-color: var(--rind); transform: translateY(-1px); }
  .ctrl-btn:active { transform: translateY(0); }
  .ctrl-btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .ctrl-btn.primary { background: var(--rind); border-color: var(--rind); color: #fff; }
  .ctrl-btn svg { width: 16px; height: 16px; }
  .ctrl-btn.icon-only { padding: 12px 14px; }

  .status-line {
    text-align: center;
    font-size: 13px;
    color: var(--ink-soft);
    min-height: 18px;
  }
</style>

<div class="app">
  <div class="topbar">
    <div class="brand">🍉 Азбука для малышей</div>
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <span class="counter" id="counter">1 / 33</span>
    </div>
  </div>

  <div class="card enter" id="card">
    <div class="eyebrow anim-eyebrow">
      <span id="eyebrowText">Азбука для малышей · буква 1 из 33</span>
      <span>3–5 лет</span>
    </div>

    <div class="scene">
      <div class="letters">
        <span class="letter-big" id="letterBig">А</span><span class="letter-small" id="letterSmall">а</span>
      </div>
      <div class="icon-wrap anim-icon" id="iconWrap"></div>
    </div>

    <div class="caption anim-caption">
      <span class="word" id="wordText">АРБУЗ</span>
      <span class="hint" id="hintText">А, как «Арбуз»</span>
    </div>
  </div>

  <div class="controls">
    <button class="ctrl-btn icon-only" id="prevBtn" type="button" aria-label="Предыдущая буква">⟵</button>
    <button class="ctrl-btn primary" id="playBtn" type="button">▶ Начать</button>
    <button class="ctrl-btn icon-only" id="nextBtn" type="button" aria-label="Следующая буква">⟶</button>
    <button class="ctrl-btn icon-only" id="muteBtn" type="button" aria-label="Выключить озвучку">🔊</button>
  </div>

  <div class="status-line" id="statusLine">Нажмите «Начать» — буквы будут сменяться примерно раз в 7–8 секунд.</div>
</div>

      icon:'<svg viewBox="0 0 160 180"><circle cx="80" cy="30" r="12" fill="#4FA6D8"/><rect x="74" y="40" width="12" height="18" fill="#3E86B0"/><polygon points="30,58 130,58 80,160" fill="#F2A230"/><ellipse cx="80" cy="58" rx="50" ry="12" fill="#F2C94C"/><path d="M20 90 Q10 70 25 55" fill="none" stroke="#B9C1CC" stroke-width="4" stroke-linecap="round"/><path d="M140 90 Q150 70 135 55" fill="none" stroke="#B9C1CC" stroke-width="4" stroke-linecap="round"/></svg>' },
    { L:'Я', l:'я', word:'ЯБЛОКО', hint:'Я, как «Яблоко»', voice:'Я, как яблоко',
      icon:'<svg viewBox="0 0 160 180"><path d="M80 55 C 30 55 20 110 45 145 C 60 165 70 165 80 155 C 90 165 100 165 115 145 C 140 110 130 55 80 55Z" fill="#E23B4A"/><path d="M80 40 C 70 55 90 55 80 40Z" fill="#8A5A34"/><rect x="77" y="20" width="6" height="24" rx="3" fill="#8A5A34"/><ellipse cx="95" cy="25" rx="14" ry="8" fill="#3FA65A" transform="rotate(20 95 25)"/><ellipse cx="55" cy="85" rx="8" ry="14" fill="#FF8B93" opacity="0.6"/></svg>' }
  ];

  var TOTAL = LETTERS.length;
  var idx = 0, playing = false, cancelled = false, muted = false;
  var gen = 0; // generation counter to cancel stale async loops

  var card = document.getElementById('card');
  var elLetterBig = document.getElementById('letterBig');
  var elLetterSmall = document.getElementById('letterSmall');
  var elIconWrap = document.getElementById('iconWrap');
  var elWord = document.getElementById('wordText');
  var elHint = document.getElementById('hintText');
  var elEyebrow = document.getElementById('eyebrowText');
  var elCounter = document.getElementById('counter');
  var elFill = document.getElementById('progressFill');
  var elStatus = document.getElementById('statusLine');
  var playBtn = document.getElementById('playBtn');
  var muteBtn = document.getElementById('muteBtn');

  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function renderSlide(i) {
    var d = LETTERS[i];
    elLetterBig.textContent = d.L;
    elLetterSmall.textContent = d.l;
    elIconWrap.innerHTML = d.icon;
    elWord.textContent = d.word;
    elHint.textContent = d.hint;
    elEyebrow.textContent = 'Азбука для малышей · буква ' + (i + 1) + ' из ' + TOTAL;
    elCounter.textContent = (i + 1) + ' / ' + TOTAL;
    elFill.style.width = (((i + 1) / TOTAL) * 100) + '%';

    card.classList.remove('enter');
    void card.offsetWidth;
    card.classList.add('enter');
  }

  var voicesReady = false;
  function ensureVoices() {
    if (!('speechSynthesis' in window)) return Promise.resolve([]);
    var v = speechSynthesis.getVoices();
    if (v.length) return Promise.resolve(v);
    return new Promise(function (resolve) {
      var done = false;
      speechSynthesis.onvoiceschanged = function () {
        if (done) return; done = true;
        resolve(speechSynthesis.getVoices());
      };
      setTimeout(function () { if (!done) { done = true; resolve(speechSynthesis.getVoices()); } }, 800);
    });
  }

  function speak(text) {
    if (muted || !('speechSynthesis' in window)) {
      return wait(Math.max(2800, text.length * 90));
    }
    return ensureVoices().then(function (voices) {
      return new Promise(function (resolve) {
        try {
          speechSynthesis.cancel();
          var u = new SpeechSynthesisUtterance(text);
          u.lang = 'ru-RU';
          u.rate = 0.85;
          u.pitch = 1.05;
          var ru = voices.filter(function (v) { return v.lang && v.lang.toLowerCase().indexOf('ru') === 0; })[0];
          if (ru) u.voice = ru;
          var settled = false;
          u.onend = function () { if (!settled) { settled = true; resolve(); } };
          u.onerror = function () { if (!settled) { settled = true; resolve(); } };
          speechSynthesis.speak(u);
          setTimeout(function () { if (!settled) { settled = true; resolve(); } }, 6000);
        } catch (e) {
          resolve();
        }
      });
    });
  }

  function goTo(i, userInitiated) {
    idx = ((i % TOTAL) + TOTAL) % TOTAL;
    renderSlide(idx);
    if (userInitiated && 'speechSynthesis' in window) speechSynthesis.cancel();
  }

  function stopPlayback() {
    playing = false;
    gen++;
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    playBtn.textContent = '▶ Начать';
    elStatus.textContent = 'На паузе. Нажмите «Начать», чтобы продолжить.';
  }

  function startPlayback() {
    if (playing) return;
    playing = true;
    playBtn.textContent = '⏸ Пауза';
    runLoop(++gen);
  }

  function runLoop(myGen) {
    if (myGen !== gen || !playing) return;
    renderSlide(idx);
    elStatus.textContent = 'Читаю: «' + LETTERS[idx].voice + '»…';
    speak(LETTERS[idx].voice).then(function () {
      if (myGen !== gen || !playing) return;
      elStatus.textContent = 'Пауза перед следующей буквой…';
      return wait(1400);
    }).then(function () {
      if (myGen !== gen || !playing) return;
      idx = (idx + 1) % TOTAL;
      if (idx === 0) {
        elStatus.textContent = 'Азбука пройдена! Начинаем сначала.';
      }
      runLoop(myGen);
    });
  }

  playBtn.addEventListener('click', function () {
    if (playing) stopPlayback(); else startPlayback();
  });

  document.getElementById('prevBtn').addEventListener('click', function () {
    stopPlayback();
    goTo(idx - 1, true);
  });

  document.getElementById('nextBtn').addEventListener('click', function () {
    stopPlayback();
    goTo(idx + 1, true);
  });

  muteBtn.addEventListener('click', function () {
    muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
    muteBtn.setAttribute('aria-label', muted ? 'Включить озвучку' : 'Выключить озвучку');
    if (muted && 'speechSynthesis' in window) speechSynthesis.cancel();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') { stopPlayback(); goTo(idx - 1, true); }
    if (e.key === 'ArrowRight') { stopPlayback(); goTo(idx + 1, true); }
    if (e.key === ' ') { e.preventDefault(); if (playing) stopPlayback(); else startPlayback(); }
  });

  renderSlide(0);
  if (!('speechSynthesis' in window)) {
    elStatus.textContent = 'Озвучка не поддерживается этим браузером — буквы всё равно будут сменяться медленно.';
  }
})();
