<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}</style></head><body>
<title>Азбука — буква А</title>
<style>
  :root {
    --bg-1: #FFF8E7;
    --bg-2: #FFEFC6;
    --card: #FFFDF8;
    --card-edge: #F3E3BE;
    --ink: #4A3324;
    --ink-soft: #9A7F5C;
    --letter: #FF6B45;
    --letter-shadow: #E85A38;
    --rind: #2F9E5B;
    --rind-dark: #227A44;
    --flesh: #FF5A5F;
    --seed: #3B2A20;
    --yellow: #FFC94A;
    --shadow: 0 30px 60px -20px rgba(74, 51, 36, 0.35);
    --focus: #2F9E5B;
  }

  :root[data-theme="dark"] {
    --bg-1: #1B1330;
    --bg-2: #2A1C46;
    --card: #241B3D;
    --card-edge: #3A2C5C;
    --ink: #F5EAD9;
    --ink-soft: #C7B6DC;
    --letter: #FF8F6B;
    --letter-shadow: #D96A48;
    --rind: #4DBE82;
    --rind-dark: #2F9E5B;
    --flesh: #FF7A7E;
    --seed: #241A38;
    --yellow: #FFD873;
    --shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.6);
    --focus: #7FD9A8;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg-1: #1B1330;
      --bg-2: #2A1C46;
      --card: #241B3D;
      --card-edge: #3A2C5C;
      --ink: #F5EAD9;
      --ink-soft: #C7B6DC;
      --letter: #FF8F6B;
      --letter-shadow: #D96A48;
      --rind: #4DBE82;
      --rind-dark: #2F9E5B;
      --flesh: #FF7A7E;
      --seed: #241A38;
      --yellow: #FFD873;
      --shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.6);
      --focus: #7FD9A8;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(20px, 4vw, 56px);
    background:
      radial-gradient(120% 90% at 50% -10%, var(--bg-2) 0%, var(--bg-1) 60%);
    font-family: 'Segoe UI Rounded', 'SF Rounded', ui-rounded, 'Nunito', 'Segoe UI', system-ui, sans-serif;
    color: var(--ink);
  }

  .stage {
    width: 100%;
    max-width: 920px;
  }

  .card {
    position: relative;
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-radius: clamp(28px, 4vw, 44px);
    box-shadow: var(--shadow);
    padding: clamp(28px, 5vw, 56px) clamp(24px, 6vw, 64px);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: clamp(10px, 2vw, 18px);
  }

  .eyebrow {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-size: clamp(12px, 1.4vw, 14px);
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
    opacity: 0;
    animation: rise 0.6s ease-out 0.05s forwards;
  }

  .eyebrow .dot-sep { opacity: 0.5; }

  .scene {
    position: relative;
    display: grid;
    grid-template-columns: 1.05fr 0.95fr;
    align-items: center;
    min-height: clamp(220px, 32vw, 340px);
  }

  .letters {
    position: relative;
    display: flex;
    align-items: baseline;
    line-height: 1;
    z-index: 2;
  }

  .letter-big {
    font-size: clamp(140px, 22vw, 300px);
    font-weight: 800;
    color: var(--letter);
    text-shadow: 6px 8px 0 var(--letter-shadow);
    transform: translateY(-140%);
    opacity: 0;
    animation: drop 0.75s cubic-bezier(.34, 1.56, .64, 1) 0.35s forwards;
  }

  .letter-small {
    font-size: clamp(70px, 11vw, 150px);
    font-weight: 700;
    color: var(--letter);
    opacity: 0.72;
    margin-left: 0.05em;
    transform: translateY(-140%);
    animation: drop 0.75s cubic-bezier(.34, 1.56, .64, 1) 0.48s forwards;
  }

  .melon-wrap {
    position: relative;
    display: flex;
    justify-content: center;
    transform: translateX(60px) rotate(10deg) scale(0.85);
    opacity: 0;
    animation: slideIn 0.7s cubic-bezier(.22, 1, .36, 1) 0.7s forwards;
  }

  .melon-wrap svg { width: clamp(150px, 24vw, 320px); height: auto; }

  .seed {
    animation: seedPop 0.4s ease-out both;
    animation-delay: calc(1.05s + var(--i) * 0.06s);
    transform-origin: center;
  }

  .dust {
    position: absolute;
    border-radius: 50%;
    animation: float 5.5s ease-in-out infinite;
  }

  .caption {
    display: flex;
    align-items: baseline;
    gap: 14px;
    flex-wrap: wrap;
    opacity: 0;
    animation: rise 0.6s ease-out 1.25s forwards;
  }

  .word {
    font-size: clamp(28px, 4vw, 44px);
    font-weight: 800;
    letter-spacing: 0.06em;
    color: var(--rind-dark);
  }

  .hint {
    font-size: clamp(15px, 1.8vw, 18px);
    font-weight: 600;
    color: var(--ink-soft);
  }

  .footer-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-top: clamp(6px, 1.5vw, 10px);
    opacity: 0;
    animation: rise 0.6s ease-out 1.4s forwards;
  }

  .series {
    font-size: clamp(12px, 1.4vw, 14px);
    color: var(--ink-soft);
  }

  .replay {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: 1.5px solid var(--card-edge);
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-weight: 700;
    font-size: clamp(13px, 1.6vw, 15px);
    padding: 10px 18px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.15s ease, border-color 0.15s ease;
  }

  .replay:hover { border-color: var(--rind); transform: translateY(-1px); }
  .replay:active { transform: translateY(0); }
  .replay:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  .replay svg { width: 16px; height: 16px; }

  @keyframes drop {
    0% { transform: translateY(-140%); opacity: 0; }
    60% { opacity: 1; }
    100% { transform: translateY(0); opacity: 1; }
  }

  @keyframes slideIn {
    to { transform: translateX(0) rotate(0deg) scale(1); opacity: 1; }
  }

  @keyframes rise {
    from { transform: translateY(10px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  @keyframes seedPop {
    from { transform: scale(0); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  @keyframes float {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-14px) scale(1.06); }
  }

  @media (prefers-reduced-motion: reduce) {
    .eyebrow, .letter-big, .letter-small, .melon-wrap, .seed, .caption, .footer-row {
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
    }
    .dust { animation: none !important; }
  }

  .replaying .eyebrow,
  .replaying .letter-big,
  .replaying .letter-small,
  .replaying .melon-wrap,
  .replaying .seed,
  .replaying .caption,
  .replaying .footer-row {
    animation: none;
  }
</style>

<div class="stage">
  <div class="card" id="card">
    <div class="eyebrow">
      <span>Азбука для малышей <span class="dot-sep">·</span> буква 1 из 33</span>
      <span>3–5 лет</span>
    </div>

    <div class="scene">
      <div class="letters">
        <span class="letter-big">А</span><span class="letter-small">а</span>
      </div>

      <div class="melon-wrap">
        <div class="dust" style="width:14px;height:14px;left:-10px;top:10px;background:var(--yellow);animation-delay:0.2s;"></div>
        <div class="dust" style="width:9px;height:9px;right:-6px;top:60%;background:var(--rind);animation-delay:1.1s;"></div>
        <svg viewBox="0 0 620 360" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M 40 320 A 280 280 0 0 1 600 320 Z" fill="var(--rind)"/>
          <path d="M 70 320 A 250 250 0 0 1 570 320 Z" fill="#F4EEDD"/>
          <path d="M 105 320 A 215 215 0 0 1 535 320 Z" fill="var(--flesh)"/>
          <line x1="40" y1="320" x2="600" y2="320" stroke="var(--rind-dark)" stroke-width="14" stroke-linecap="round"/>
          <ellipse class="seed" style="--i:0" cx="230" cy="255" rx="11" ry="19" fill="var(--seed)" transform="rotate(-20 230 255)"/>
          <ellipse class="seed" style="--i:1" cx="320" cy="222" rx="11" ry="19" fill="var(--seed)"/>
          <ellipse class="seed" style="--i:2" cx="410" cy="255" rx="11" ry="19" fill="var(--seed)" transform="rotate(20 410 255)"/>
          <ellipse class="seed" style="--i:3" cx="270" cy="300" rx="11" ry="19" fill="var(--seed)" transform="rotate(-10 270 300)"/>
          <ellipse class="seed" style="--i:4" cx="370" cy="300" rx="11" ry="19" fill="var(--seed)" transform="rotate(10 370 300)"/>
        </svg>
      </div>
    </div>

    <div class="caption">
      <span class="word">АРБУЗ</span>
      <span class="hint">А, как «Арбуз»</span>
    </div>

    <div class="footer-row">
      <span class="series">Черновой кадр · превью анимации, не итоговое видео</span>
      <button class="replay" id="replayBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
        Проиграть ещё раз
      </button>
    </div>
  </div>
</div>

<script>
  document.getElementById('replayBtn').addEventListener('click', function () {
    var card = document.getElementById('card');
    card.classList.add('replaying');
    void card.offsetWidth;
    card.classList.remove('replaying');
  });
</script>

</body></html>
